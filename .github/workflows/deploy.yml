name: Deploy Svelte application
on:
  release:
    types: published

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # MARK: Build
  build:
    name: Build
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build step
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./dist

  # MARK: Deploy
  deploy:
    name: Deploy
    runs-on: ubuntu-slim
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
