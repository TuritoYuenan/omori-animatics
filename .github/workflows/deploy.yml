name: Deploy
on:
  push:
    branches: svelte-app
  pull_request:
    branches: svelte-app

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build step
        run: npm run build

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "omori-animatics"
          entrypoint: https://deno.land/std@0.204.0/http/file_server.ts # 📝 Update the entrypoint if necessary
          root: dist # 📝 Update the root if necessary
